<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- FAVICON  {% static 'assets/img/MyPosh.svg' %}--> 
        <link rel="shortcut icon" href="static/assets/img/MyPosh.svg" type="image/x-icon">

        <!-- ICONS -->
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
        <!-- CSS {% static 'assets/css/main.css' %}-->
        <link rel="stylesheet" href="register.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.5/build/css/intlTelInput.css">
        <script src="cities.js"></script>
        <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"
      />
      <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
        <title>Registration Form</title>
</head>
<body>
    <div class="container">
        <header>
            Registration
        </header>
        <form action="#">
            <div class="form-first">
                <div class="details personal">
                    <span class="title">
                        Individual Details
                    </span>

                    <div class="fields">
                        <div class="input-field">
                            <label>Prefix</label>
                                <select id="prefix" name="prefix" required>
                                    <option value="mr" selected>Mr</option>
                                    <option value="mrs">Mrs</option>
                                    <option value="miss">Miss</option>
                                </select>
                                <label>First Name</label>
                                <input type="text" placeholder="Enter First Name" required>
                        </div>

                        <div class="input-field">
                            <label>Middle Name</label>
                            <input type="text" placeholder="Enter Middle Name" required>
                        </div>

                        <div class="input-field">
                            <label>Last Name</label>
                            <input type="text" placeholder="Enter Last Name" required>
                        </div>

                        <div class="input-field">
                            <label for="date-input">Date of Birth</label>
                            <input type="date" id="date-input" placeholder="Enter birth date" required>
                        </div>

                        <div class="input-field">
                            <label>Gender</label>
                            <select id="gender" class="form-control" required>
                                <option value="" disabled selected>Select your gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
 
                        <div class="input-field">
                            <label>Occupation</label>
                            <input type="text" placeholder="Enter your Occupation" required>
                        </div>

                        <div class="input-field">
                            <label>State</label>
                            <select onchange="print_city('state', this.selectedIndex);" id="sts" name ="stt" class="form-control" required></select>
                        </div>

                        <div class="input-field">
                            <label>City</label>
                            <select id ="state" class="form-control" required ></select>
                            <script language="javascript">print_state("sts");</script>
                        </div>

                        <div class="input-field">
                            <label>Pincode</label>
                            <input type="number" placeholder="Enter Pincode" required>
                        </div>

                        <div class="password-input-field">
                            <label>Password</label>
                            <input type="Password" id= "password" placeholder="Enter your Password" required>
                        </div>
                        
                        <div class="password-input-field">
                            <label>Confirm Password</label>
                            <input type="Password" id= "password"  placeholder="Confirm your Password" required>
                        </div>


                    <div class="details ID">   
                        <div class="input-field email-field">
                            <label class="required-field">Email</label>
                            <p id="error-msg">Please Enter A Valid Email Id</p>
                            <div class="combine">
                                <input type="email" id="email-id" placeholder="Enter your email" oninput="checker()" required>
                                <button class="ValBtn one" disabled>Validate</button>
                            </div>
                        </div>

                        <div class="input-field phone-field">
                            <label class="required-field">Mobile Number</label>
                            <p id="errormsg">Please Enter A Valid Phone Number</p>
                            <div class="combine">
                                <input type="tel" id="phone" placeholder="Enter mobile number" minlength="10" maxlength="10" oninput="checkerphone()" required>
                                <button class="ValBtn two" disabled>Validate</button>
                            </div>
                        </div>
                    </div>
                </div>
                </div> 

                    <div class="buttons">
                        <div class="backBtn">
                            <i class="ri-arrow-left-s-line"></i>
                            <span class="btnText">Back</span>
                        </div>

                        <button class="nextBtn" id="submitButton">
                            <span class="btnText">Submit</span>
                            <i class="ri-skip-right-fill"></i>
                        </button>
                    </div>
                </div>
                
            </div>
        </form>
    </div>
    <script src="register.js"></script>
</body>
</html>
