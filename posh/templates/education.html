
<div class="container-education">
    <div class="add_education">
        <h2>Education Details</h2>
        <button type='button' id="add-education-btn" data-toggle="modal" data-target="#addEducationModal">+ Add</button>
    </div>

    <!-- Education Section -->
    <div id="education-section">
        <ul id="education-list">
            <!-- Educational experiences will be dynamically added here -->
        </ul>
    </div>

    <!-- Add Education Modal -->
    <div class="modal fade" id="addEducationModal" tabindex="-1" role="dialog" aria-labelledby="addEducationModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addEducationModalLabel">Add Education</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- School -->
                    <div class="form-group">
                        <label for="schoolInput">School</label>
                        <input type="text" id="schoolInput" name='edu_school' class="form-control" placeholder="Enter the school name">
                    </div>

                    <!-- Degree -->
                    <div class="form-group">
                        <label for="degreeInput">Degree</label>
                        <input type="text" id="degreeInput" name='edu-degree' class="form-control" placeholder="Enter your degree">
                    </div>

                    <!-- Field of Study -->
                    <div class="form-group">
                        <label for="fieldOfStudyInput">Field of Study</label>
                        <input type="text" id="fieldOfStudyInput" name='edu-field_of_study' class="form-control" placeholder="Enter your field of study">
                    </div>

                    <!-- Start Date -->
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="startDateMonth">Start Date</label>
                            <input type="month" id="startDate" name='edu-start_date' class="form-control" placeholder="Enter start month">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="startDateYear">End Date/Expected</label>
                            <input type="month" id="endDate" name='edu-end_date' class="form-control" placeholder="Enter start year">
                        </div>
                    </div>

                    <!-- Grade -->
                    <div class="form-group">
                        <label for="gradeInput">Grade</label>
                        <input type="text" id="gradeInput" name='edu-grade' class="form-control" placeholder="Enter your grade">
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label for="descriptionInput">Description</label>
                        <textarea id="descriptionInput" class="form-control" name='edu-description' rows="5" placeholder="Enter a description of your education"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveEducationBtn">Save Education</button>
                </div>
            </div>
        </div>
    </div>
    </div>
