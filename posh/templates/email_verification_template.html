<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <style>
        h1 {
            color: hsl(30, 100%, 52%);
        }

        p {
            color: #666;
        }

        .otp-code {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
        }

        .note {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MyPosh Email Verification</h1>
        <p>Your OTP for email verification for MyPosh profile is: <span class="otp-code">{{ otp }}</span></p>
        <p class="note">Please do not share this OTP with anyone.</p>
    </div>
</body>
</html>
